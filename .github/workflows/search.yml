name: Find Random Help Wanted Issues

on:
  workflow_dispatch: # 手動実行

jobs:
  find-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Filter Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 日付の計算 (直近5日以内)
          # macOS/Linuxのdateコマンドの差異に注意 (ubuntu-latestはGNU date)
          SINCE_DATE=$(date -u -d "5 days ago" +%Y-%m-%d)
          
          echo "Searching issues updated since: $SINCE_DATE"

          # 2. GitHub Search APIで条件に合うissuesを取得
          # 条件:
          #   - type:issue (プルリクエストを除外)
          #   - state:open (オープンなもの)
          #   - language:javascript (JavaScript製)
          #   - label:"Help Wanted"
          #   - updated:>=指定した日付
          # JSON形式で最大100件取得
          QUERY="type:issue state:open language:javascript label:\"Help Wanted\" updated:>=$SINCE_DATE"
          
          ISSUES_JSON=$(gh search issues "$QUERY" --json number,title,url,updatedAt --limit 100)

          # 3. 取得できた件数の確認
          COUNT=$(echo "$ISSUES_JSON" | jq 'length')
          echo "Found $COUNT matching issues."

          if [ "$COUNT" -eq 0 ]; then
            echo "No matching issues found."
            exit 0
          fi

          echo "---"
          echo "Selecting up to 10 random issues:"

          # 4. jqを使ってランダムに最大10件抽出し、見やすく表示する
          echo "$ISSUES_JSON" | jq -r '
            shuffle | 
            limit(10; .[]) | 
            "• [\(.number)] \(.title)\n  URL: \(.url)\n  Updated: \(.updatedAt)\n"
          '
